# Test config: in-memory H2 instead of MySQL, and Kafka listeners off,
# so tests run without Docker.
spring:
  datasource:
    url: jdbc:h2:mem:accountdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    listener:
      auto-startup: false
